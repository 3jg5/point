<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e6b72" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ونار" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/app.css" />
    <title>ونار | نقاط المشرفين</title>
  </head>
  <body>
    <div id="root"><p id="boot" style="font-family:sans-serif;text-align:center;margin-top:30vh;color:#0e6b72">جاري التحميل...</p></div>
    <script>
      // إذا تعثّر التحميل تظهر رسالة بدل الصفحة الفارغة
      (function () {
        function show(msg) {
          var b = document.getElementById('boot');
          if (b) b.innerHTML = 'تعذّر تشغيل الموقع<br><small dir="ltr" style="color:#b3382c">' + String(msg).replace(/</g, '&lt;') + '</small><br><a href="diagnose.html">افتح صفحة الفحص diagnose.html</a>';
        }
        window.addEventListener('error', function (e) { show(e.message || (e.target && (e.target.src || e.target.href)) || 'error'); }, true);
        window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || e.reason); });
        setTimeout(function () { if (document.getElementById('boot')) show('لم يبدأ التطبيق خلال 8 ثوانٍ'); }, 8000);
      })();
    </script>
    <script src="config.js"></script>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
